# Render Blueprint for the public demo API (free plan).
# Render dashboard -> New -> Blueprint -> pick this repo. Fill the `sync: false` values when asked.
services:
  - type: web
    name: ai-ops-support-agent-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # --- secrets you paste in the Render dashboard -----------------------------
      - key: DATABASE_URL # Neon connection string (direct, with ?sslmode=require)
        sync: false
      - key: GEMINI_API_KEY # free key from https://aistudio.google.com/apikey
        sync: false
      - key: GROQ_API_KEY # optional free fallback, https://console.groq.com/keys
        sync: false
      - key: CORS_ORIGINS # the console URL, e.g. https://ai-ops-console.vercel.app
        sync: false
      # --- generated / fixed ------------------------------------------------------------
      - key: READONLY_DB_PASSWORD
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_FALLBACKS
        value: groq
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_BACKUP_MODELS
        value: gemini-3.6-flash,gemini-3.8-flash
      - key: GEMINI_THINKING_LEVEL
        value: low
      - key: EMBEDDING_PROVIDER
        value: fastembed
      # Public-demo safety: pristine data on every cold start + per-visitor LLM budget.
      - key: DEMO_RESET_ON_START
        value: "true"
      - key: DEMO_RATE_LIMIT_PER_HOUR
        value: "30"
