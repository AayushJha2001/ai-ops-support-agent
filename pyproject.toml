[project]
name = "ops-support-agent"
version = "0.1.0"
description = "AI Operations & Support Agent: a LangGraph agent that runs multi-step support workflows with tools, human-in-the-loop approvals, guardrails and evaluations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langchain-core>=1.8",
    "langgraph-checkpoint-postgres>=3.2",
    "langchain-google-genai>=4.5",
    "langchain-groq>=1.2",
    "langchain-ollama>=1.2",
    "psycopg[binary,pool]>=3.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "fastembed>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.5",
    "httpx>=0.27",
    "ruff>=0.6",
]

[project.scripts]
ops-agent = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: needs a running PostgreSQL (pgvector) database"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "ASYNC240"]  # one-off startup file reads are fine
