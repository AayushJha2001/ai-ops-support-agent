name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: ops
          POSTGRES_PASSWORD: ops
          POSTGRES_DB: ops_agent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ops -d ops_agent"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://ops:ops@localhost:5432/ops_agent
      # Offline + deterministic: no API keys, no model downloads.
      LLM_PROVIDER: fake
      LLM_FALLBACKS: ""
      EMBEDDING_PROVIDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check app evals tests
          ruff format --check app evals tests
      - name: Unit + integration tests
        run: pytest -q
      - name: Smoke eval (gates the merge)
        run: |
          ops-agent init-db
          ops-agent eval --tags smoke --min-pass-rate 1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
